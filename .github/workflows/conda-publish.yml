# The recipe pins a CRAN release (version + sha256 move together), so there is
# no version input here: to publish a new chameleon, bump conda-recipe/meta.yaml
# and run this workflow.
name: Build and publish conda package

on:
  workflow_dispatch:
  push:
    paths:
      - "conda-recipe/**"
      - ".github/workflows/conda-publish.yml"
    branches:
      - master

jobs:
  build_conda:
    name: conda (${{ matrix.os }}, R ${{ matrix.r_base }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    # One job per (os, R version) rather than one job looping conda-build's
    # variants. conda-build crashed outright on iceqream's five-variant loop
    # with "IndexError: list index out of range" in render.py - it skipped two
    # variants silently and died on a third. Split into jobs, all five passed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r_base: "4.1"}
          - {os: ubuntu-latest, r_base: "4.2"}
          - {os: ubuntu-latest, r_base: "4.3"}
          - {os: ubuntu-latest, r_base: "4.4"}
          - {os: ubuntu-latest, r_base: "4.5"}
          - {os: macos-14, r_base: "4.5"}
    steps:
      - uses: actions/checkout@v5

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: base
          auto-activate: true

      - name: Install conda-build and anaconda-client
        run: |
          conda install -n base -y conda-build anaconda-client

      - name: Build conda package
        run: |
          conda build conda-recipe/ \
            --no-anaconda-upload \
            --output-folder conda-output/ \
            --variants "{r_base: ['${{ matrix.r_base }}']}" \
            -c conda-forge

      - name: Upload to anaconda.org
        if: always()
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          shopt -s nullglob
          PACKAGES=( conda-output/**/*.tar.bz2 conda-output/**/*.conda )

          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "WARNING: No conda packages found in conda-output/"
            find conda-output/ -type f
            exit 0
          fi

          echo "Uploading ${#PACKAGES[@]} package(s):"
          printf '  %s\n' "${PACKAGES[@]}"

          anaconda -t "$ANACONDA_TOKEN" upload \
            --user aviezerl \
            --label main \
            --force \
            "${PACKAGES[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conda-pkg-${{ matrix.os }}-r${{ matrix.r_base }}
          path: |
            conda-output/**/*.tar.bz2
            conda-output/**/*.conda
